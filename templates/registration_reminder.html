<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{email_title}}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f7ff;
      font-family: 'Poppins', Arial, sans-serif;
    "
  >
    <div style="max-width: 600px; margin: 0 auto; padding: 30px 15px">
      <!-- LOGO -->
      <div style="text-align: center; margin-bottom: 25px">
        <img
          alt="BeTogether Logo"
          src="https://api.betogetherapp.com/logo.jpg"
          height="40"
          style="border-radius: 5px"
        />
      </div>

      <!-- CARD -->
      <div
        style="
          background: white;
          border-radius: 28px;
          padding: 35px 30px;
          box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.08);
          text-align: center;
        "
      >
        <h1
          style="margin: 0; font-size: 24px; color: {{title_color}}; font-weight: 600"
        >
          {{title_text}}
        </h1>

        <p style="margin-top: 18px; font-size: 16px; color: #555">
          Hello <strong>{{name}}</strong>,
        </p>

        <p style="margin-top: 10px; font-size: 15px; color: #666">
          {{intro_text}}
        </p>

        <!-- HOW TO FINISH (hidden on the "account removed" email) -->
        {{steps_section}}

        <!-- DEADLINE / STATUS BOX -->
        {{deadline_html}}

        <!-- OPTIONAL BUTTON (only when an app link is configured) -->
        {{cta_html}}

        <p style="margin-top: 25px; font-size: 15px; color: #666">
          {{closing_text}}
        </p>

        <p style="margin-top: 10px; font-size: 13px; color: #999">
          Didn't sign up for BeTogether? You can ignore this email — the
          unfinished sign-up is removed automatically.
        </p>
      </div>

      <!-- FOOTER -->
      <div
        style="
          text-align: center;
          margin-top: 35px;
          font-size: 13px;
          color: #999;
        "
      >
        © {{year}} BeTogether — All Rights Reserved
      </div>
    </div>
  </body>
</html>
